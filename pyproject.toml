[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff.lint.isort]
known-first-party = ["app", "conftest", "test_rules"]
